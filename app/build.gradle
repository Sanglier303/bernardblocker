plugins { id 'com.android.application' }

def bernardReleaseKeystore = rootProject.file('.signing/bernard-release.jks')
def signingStorePassword = System.getenv('BERNARD_SIGNING_STORE_PASSWORD')
def signingKeyAlias = System.getenv('BERNARD_SIGNING_KEY_ALIAS')
def signingKeyPassword = System.getenv('BERNARD_SIGNING_KEY_PASSWORD')
def hasBernardReleaseSigning = bernardReleaseKeystore.exists()
        && signingStorePassword
        && signingKeyAlias
        && signingKeyPassword

android {
    namespace 'com.local.focusfence'
    compileSdk 36

    signingConfigs {
        bernardRelease {
            if (bernardReleaseKeystore.exists()) {
                storeFile bernardReleaseKeystore
            }
            storePassword signingStorePassword ?: 'missing'
            keyAlias signingKeyAlias ?: 'missing'
            keyPassword signingKeyPassword ?: 'missing'
        }
    }

    defaultConfig {
        applicationId 'com.local.focusfence'
        minSdk 26
        targetSdk 36
        versionCode 15
        versionName '0.4.8'
        testInstrumentationRunner 'com.local.focusfence.qa.BernardTestRunner'
    }

    buildTypes {
        debug {
            // Never sign debuggable/test artifacts with the production identity. The permanent
            // Bernard key is reserved for the release installed on the user's phone.
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            if (hasBernardReleaseSigning) {
                signingConfig signingConfigs.bernardRelease
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions { animationsDisabled true }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
