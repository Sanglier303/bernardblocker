plugins { id 'com.android.application' }

def bernardReleaseKeystore = rootProject.file('.signing/bernard-release.jks')
def signingStorePassword = System.getenv('BERNARD_SIGNING_STORE_PASSWORD')
def signingKeyAlias = System.getenv('BERNARD_SIGNING_KEY_ALIAS')
def signingKeyPassword = System.getenv('BERNARD_SIGNING_KEY_PASSWORD')
def hasBernardReleaseSigning = bernardReleaseKeystore.exists()
        && signingStorePassword
        && signingKeyAlias
        && signingKeyPassword

android {
    namespace 'com.local.focusfence'
    compileSdk 35

    signingConfigs {
        bernardRelease {
            if (bernardReleaseKeystore.exists()) {
                storeFile bernardReleaseKeystore
            }
            storePassword signingStorePassword ?: 'missing'
            keyAlias signingKeyAlias ?: 'missing'
            keyPassword signingKeyPassword ?: 'missing'
        }
    }

    defaultConfig {
        applicationId 'com.local.focusfence'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '0.4.3'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        debug {
            // CI main builds use the permanent Bernard key. Local/PR builds fall back to the
            // normal Android debug key without ever embedding release credentials in source.
            if (hasBernardReleaseSigning) {
                signingConfig signingConfigs.bernardRelease
            }
        }
        release {
            minifyEnabled false
            if (hasBernardReleaseSigning) {
                signingConfig signingConfigs.bernardRelease
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions { animationsDisabled true }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
