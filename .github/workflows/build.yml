name: Bernard - APK and native UI verification
on:
  workflow_dispatch:
  push:
    branches: [main, 'design/**', 'fix/**']
    paths-ignore: ['**.md', '.github/workflows/import-design.yml']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Reuse development signing key when available
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: bernard-development-signing-v1
      - name: Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          chmod +x gradlew
      - name: Unit tests, lint and compilation
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :fixture:assembleDebug --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native Android UI and real fixture blocking
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell wm size 1080x2340
            adb shell wm density 420
            adb install -r fixture/build/outputs/apk/debug/fixture-debug.apk
            mkdir -p qa-screens
            ./gradlew :app:connectedDebugAndroidTest --stacktrace
            # Gradle may uninstall the instrumented APK after tests, which removes
            # its external-files directory. Screenshots are useful QA evidence,
            # but their absence must not turn a passing native test suite red.
            adb pull /sdcard/Android/data/com.local.focusfence/files/qa/. qa-screens/ || true
      - name: APK verification and source archive
        run: |
          mkdir -p delivery
          cp app/build/outputs/apk/debug/app-debug.apk delivery/Bernard-Bloqueur-v0.3.1.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs delivery/Bernard-Bloqueur-v0.3.1.apk > delivery/signature.txt
          sha256sum delivery/Bernard-Bloqueur-v0.3.1.apk > delivery/SHA256SUMS.txt
          git archive --format=zip --prefix=BernardBloqueur-v0.3.1/ HEAD -o delivery/BernardBloqueur-v0.3.1-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Bernard-Bloqueur-v0.3.1-delivery
          path: delivery/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Bernard-native-QA
          path: |
            qa-screens/
            app/build/reports/
            app/build/outputs/androidTest-results/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 30
