name: Bernard - verified Android release

on:
  workflow_dispatch:
  push:
    branches: [main, 'design/**', 'fix/**', 'security/**']
    paths-ignore: ['**.md', '.github/workflows/import-design.yml']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bernard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      version: ${{ steps.package.outputs.version }}
      code: ${{ steps.package.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare permanent signing key on main only
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          BERNARD_SIGNING_KEYSTORE_B64: ${{ secrets.BERNARD_SIGNING_KEYSTORE_B64 }}
          BERNARD_SIGNING_STORE_PASSWORD: ${{ secrets.BERNARD_SIGNING_STORE_PASSWORD }}
          BERNARD_SIGNING_KEY_ALIAS: ${{ secrets.BERNARD_SIGNING_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BERNARD_SIGNING_KEYSTORE_B64"
          mkdir -p .signing
          printf '%s' "$BERNARD_SIGNING_KEYSTORE_B64" | base64 --decode > .signing/bernard-release.jks
          chmod 600 .signing/bernard-release.jks
          CERT="$(keytool -list -v -keystore .signing/bernard-release.jks -storepass "$BERNARD_SIGNING_STORE_PASSWORD" -alias "$BERNARD_SIGNING_KEY_ALIAS" | sed -n 's/.*SHA256: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          diff -u SIGNING_CERTIFICATE.sha256 <(printf '%s\n' "$CERT")

      - name: Install compile SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          chmod +x gradlew

      - name: Unit tests, both lint variants and unsigned QA compilation
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest :fixture:assembleDebug --stacktrace

      - name: Unit tests, both lint variants and permanently signed compilation
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          BERNARD_SIGNING_STORE_PASSWORD: ${{ secrets.BERNARD_SIGNING_STORE_PASSWORD }}
          BERNARD_SIGNING_KEY_ALIAS: ${{ secrets.BERNARD_SIGNING_KEY_ALIAS }}
          BERNARD_SIGNING_KEY_PASSWORD: ${{ secrets.BERNARD_SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest :fixture:assembleDebug --stacktrace

      - name: Package versioned artifacts and validate signature
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p device-tests delivery
          cp app/build/outputs/apk/debug/app-debug.apk device-tests/app.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk device-tests/tests.apk
          cp fixture/build/outputs/apk/debug/fixture-debug.apk device-tests/fixture.apk
          python3 - <<'PY'
          import json, os, re, shutil, subprocess, hashlib
          from pathlib import Path
          metadata=json.loads(Path('app/build/outputs/apk/release/output-metadata.json').read_text())
          item=metadata['elements'][0];version=item['versionName'];code=item['versionCode']
          assert re.fullmatch(r'[0-9]{1,6}\.[0-9]{1,6}\.[0-9]{1,6}',version)
          assert isinstance(code,int) and code>0
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write(f'version={version}\ncode={code}\n')
          signed=os.environ['GITHUB_REF']=='refs/heads/main' and os.environ['GITHUB_EVENT_NAME']!='pull_request'
          source=Path('app/build/outputs/apk/release')/item['outputFile']
          apk=Path('delivery')/f'Bernard-Bloqueur-v{version}{"" if signed else "-unsigned"}.apk'
          shutil.copyfile(source,apk)
          if not signed: shutil.copyfile('device-tests/app.apk',f'delivery/Bernard-Bloqueur-v{version}-QA.apk')
          digest=hashlib.sha256(apk.read_bytes()).hexdigest()
          if signed:
              result=subprocess.check_output([os.environ['ANDROID_HOME']+'/build-tools/35.0.0/apksigner','verify','--verbose','--print-certs',str(apk)],text=True)
              Path('delivery/signature.txt').write_text(result)
              certificate=re.search(r'Signer #1 certificate SHA-256 digest: ([0-9a-f]+)',result).group(1)
              assert certificate==Path('SIGNING_CERTIFICATE.sha256').read_text().strip()
              debug_result=subprocess.check_output([os.environ['ANDROID_HOME']+'/build-tools/35.0.0/apksigner','verify','--print-certs','device-tests/app.apk'],text=True)
              debug_certificate=re.search(r'Signer #1 certificate SHA-256 digest: ([0-9a-f]+)',debug_result).group(1)
              assert debug_certificate!=certificate, 'Debug/test APK must not use the production signing identity'
              badging=subprocess.check_output([os.environ['ANDROID_HOME']+'/build-tools/35.0.0/aapt','dump','badging',str(apk)],text=True)
              assert 'application-debuggable' not in badging, 'Release APK must not be debuggable'
              Path('delivery/update-manifest.json').write_text(json.dumps(dict(versionCode=code,versionName=version,sha256=digest,certificateSha256=certificate),indent=2)+'\n')
          Path('delivery/SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(Path('delivery').glob('*.apk'))))
          subprocess.run(['git','archive','--format=zip',f'--prefix=BernardBloqueur-v{version}/','HEAD','-o',f'delivery/BernardBloqueur-v{version}-source.zip'],check=True)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: Bernard-device-test-input
          path: device-tests/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: Bernard-Bloqueur-v${{ steps.package.outputs.version }}-${{ github.ref == 'refs/heads/main' && 'delivery' || 'QA' }}
          path: delivery/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Bernard-unit-and-lint
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 30
      - name: Remove signing material
        if: always()
        run: rm -rf .signing

  native:
    name: Android API ${{ matrix.api }} regression journeys
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35, 36]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Bernard-device-test-input
          path: device-tests
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumentation on a real Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell wm size 1080x2340
            adb shell wm density 420
            adb install -r device-tests/fixture.apk
            adb install -r device-tests/app.apk
            adb install -r device-tests/tests.apk
            mkdir -p qa-screens
            nohup adb logcat -b all -v threadtime > qa-screens/logcat-full.txt 2>&1 < /dev/null & echo $! > logcat.pid
            timeout 15m adb shell am instrument -w -r com.local.focusfence.test/androidx.test.runner.AndroidJUnitRunner > instrumentation.txt 2>&1 || echo $? > instrumentation-exit.txt
            cat instrumentation.txt
            adb pull /sdcard/Android/data/com.local.focusfence/files/qa/. qa-screens/ || echo "No screenshots recovered" > qa-screens/missing.txt
            timeout 20s adb shell dumpsys activity exit-info com.local.focusfence > qa-screens/process-exits.txt 2>&1 || true
            timeout 20s adb shell ps -A -T > qa-screens/processes.txt 2>&1 || true
            timeout 20s adb shell dumpsys activity processes > qa-screens/activity-processes.txt 2>&1 || true
            adb logcat -d -t 3000 > qa-screens/logcat.txt
            adb shell dumpsys activity activities > qa-screens/activities.txt
            kill "$(cat logcat.pid)" || true
            test ! -f instrumentation-exit.txt
            python3 -c "import pathlib,re; s=pathlib.Path('instrumentation.txt').read_text(); assert re.search(r'OK \([1-9][0-9]* tests?\)',s), 'Instrumentation did not report a completed passing suite'; assert 'FAILURES!!!' not in s and 'INSTRUMENTATION_FAILED' not in s"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Bernard-native-QA-api-${{ matrix.api }}
          path: |
            instrumentation.txt
            instrumentation-exit.txt
            qa-screens/
          if-no-files-found: warn
          retention-days: 30

  publish_release:
    name: Publish only after every validation passes
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, native]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Bernard-Bloqueur-v${{ env.VERSION }}-delivery
          path: release
      - name: Publish an atomic signed release without overwriting a version
        shell: bash
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          APK="release/Bernard-Bloqueur-v$VERSION.apk"
          test -s "$APK"; test -s release/update-manifest.json; test -s release/signature.txt
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish > existing.txt 2>/dev/null; then
            test "$(cat existing.txt)" = "$GITHUB_SHA" || { echo 'Version already published from a different commit; bump versionCode/versionName.' >&2; exit 1; }
            mkdir -p existing
            gh release download "$TAG" --pattern 'update-manifest.json' --dir existing --repo "$GITHUB_REPOSITORY"
            cmp release/update-manifest.json existing/update-manifest.json
            exit 0
          fi
          gh release create "$TAG" "$APK" release/update-manifest.json release/SHA256SUMS.txt release/signature.txt "release/BernardBloqueur-v$VERSION-source.zip" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Bernard Bloqueur $TAG" --draft --notes "Version $VERSION. Signature permanente Bernard, tests unitaires et parcours Android API 26/35/36 validés. Voir CHANGELOG.md et docs/AUDIT-v0.4.5.md pour la portée des corrections et les limites de validation."
          gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
