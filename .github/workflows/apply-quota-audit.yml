name: Materialize native regression fixes
on:
  push:
    branches: [audit/quota-workbench-20260922]
    paths: ['.audit/**', '.github/workflows/apply-quota-audit.yml']
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and materialize native followup without publishing
        shell: bash
        run: |
          set -euo pipefail
          cp .audit/native_followup.py "$RUNNER_TEMP/native_followup.py"
          git checkout --detach 3393f9f22d0fcb3a36d78a3632d85ec87c232326
          test "$(git write-tree)" = '578f6668a39827c926097ec1e144f2f43a3309c2'
          if git ls-remote --exit-code --heads origin audit/quota-native-followup-20260922 >/dev/null; then
            echo 'Followup branch already exists; refusing to overwrite'; exit 1
          fi
          python3 "$RUNNER_TEMP/native_followup.py" .
          git add .
          git diff --cached --check
          echo "Resulting source tree: $(git write-tree)"
          test "$(git write-tree)" = '5c7d67e104a67b603114e9bd39092e71f6e147b1'
          git config user.name 'Bernard audit'
          git config user.email 'audit@users.noreply.github.com'
          git commit -m 'Invalidate closed Settings roots and wait for real service teardown in tests'
          git push origin HEAD:refs/heads/audit/quota-native-followup-20260922
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
