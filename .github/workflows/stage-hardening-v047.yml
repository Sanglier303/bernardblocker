name: Prepare additional Bernard UI regression coverage
on:
  push:
    branches: [maintenance/hardening-v0.4.7-stage1]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify edit recipe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,lzma,hashlib
          script=lzma.decompress(base64.b64decode(Path('.maintenance/supplement.b64').read_text()))
          assert hashlib.sha256(script).hexdigest()=='22eb747c775ead1166c2ae556425a22fce664f86b81de64c2e65f107ac2eb08a'
          Path('/tmp/supplement.py').write_bytes(script)
          PY
      - name: Prepare source-only candidate, not main
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach 340c4d0142a4b53ccf8a87cbfcfcc1f17f100b34
          python3 /tmp/supplement.py
          python3 tools/verify_hardening.py
          git add -A
          git diff --cached --check
          TREE="$(git write-tree)"
          test "$TREE" = c3ae5686beec488a0cda828eb06174d490189ebd
          BRANCH=maintenance/hardening-v047-ui-candidate
          test -z "$(git ls-remote --heads origin "$BRANCH")"
          git config user.name 'Bernard maintenance'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'Exercise PIN enrollment and migration UI; reset paused prompts and tolerate malformed diagnostic records'
          git push origin HEAD:refs/heads/$BRANCH
          echo "UI candidate $(git rev-parse HEAD), verified tree $TREE. No merge or validation implied." >> "$GITHUB_STEP_SUMMARY"
