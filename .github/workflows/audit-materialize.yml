name: Bernard audit patch verification
on:
  push:
    branches: ['audit/functional-v0.4.4']
    paths: ['.audit/**', '.github/workflows/audit-materialize.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/functional-v0.4.4
      - uses: actions/upload-artifact@v4
        with:
          name: Bernard-audit-transport
          path: .audit/
          include-hidden-files: true
          retention-days: 2
      - name: Verify and apply audited app-only patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, json, pathlib, subprocess
          expected = ['f4980d31022467acc96c079abb085c07ce1f3e66d9beeeece1e54b0e6f4bf139', 'ab8205a67e0bb02075b926c20849e59e2db8619bd54963d430758355e3c6ac67', 'ed9819bedbce7914b5990efd9fafdc69832bb5ed9e0b1651cd5e5ec0d801cf52']
          repair_path = pathlib.Path('.audit/repairs.json')
          repairs = json.loads(repair_path.read_text()) if repair_path.exists() else {}
          chunks = []
          for i, want in enumerate(expected, 1):
              filename = f'payload-{i}.b64'
              raw = pathlib.Path('.audit', filename).read_text().strip()
              if filename in repairs:
                  spec = repairs[filename]
                  assert hashlib.sha256(raw.encode()).hexdigest() == spec['inputSha256'], filename + ' repair input mismatch'
                  for start, end, replacement in sorted(spec['edits'], reverse=True):
                      raw = raw[:start] + replacement + raw[end:]
              actual = hashlib.sha256(raw.encode()).hexdigest()
              print(filename, len(raw), actual, flush=True)
              assert actual == want, filename + ' transport mismatch; no source changes applied'
              chunks.append(raw)
          patch = gzip.decompress(base64.b64decode(''.join(chunks), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '7573396dbf5ba5593b3a98e9020cdd71fbd3ed425322cf08c46455a61a1ffbd4'
          for line in patch.decode().splitlines():
              if line.startswith('diff --git '):
                  assert line.startswith('diff --git a/app/') and ' b/app/' in line, line
          pathlib.Path('/tmp/bernard-audit.patch').write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '/tmp/bernard-audit.patch'], check=True)
          subprocess.run(['git', 'apply', '/tmp/bernard-audit.patch'], check=True)
          subprocess.run(['git', 'diff', '--check'], check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app
          git commit -m 'fix(audit): correct Android authorization, selective detection, accounting and updater flows'
          git push origin HEAD:audit/functional-v0.4.4
